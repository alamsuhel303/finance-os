<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome · Finance OS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    :root {
      --bg-deep: #07090f;
      --bg-card: rgba(17, 24, 39, 0.72);
      --border: rgba(255, 255, 255, 0.07);
      --border-strong: rgba(255, 255, 255, 0.12);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #5eead4;
      --accent-soft: rgba(94, 234, 212, 0.12);
      --accent-strong: #2dd4bf;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      --font-display: "Outfit", system-ui, sans-serif;
      --font-body: "DM Sans", system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-body);
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(45, 212, 191, 0.10), transparent 55%),
        radial-gradient(900px 500px at 80% 80%, rgba(56, 189, 248, 0.06), transparent 50%),
        var(--bg-deep);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .setup-container {
      width: 100%;
      max-width: 540px;
      animation: fadeUp 0.6s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .brand-row {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--accent), #38bdf8);
      color: #07090f;
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 1rem;
      box-shadow: 0 4px 24px rgba(94, 234, 212, 0.25);
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0;
    }

    .brand-sub {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }

    .setup-card {
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: var(--shadow);
    }

    .step-label {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--text-primary);
    }

    .mode-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .mode-option {
      position: relative;
    }

    .mode-option input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .mode-option label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      padding: 1.25rem 1rem;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border-strong);
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .mode-option label:hover {
      border-color: rgba(94, 234, 212, 0.3);
      background: rgba(94, 234, 212, 0.04);
    }

    .mode-option input:checked + label {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 0 0 1px var(--accent), 0 2px 12px rgba(94, 234, 212, 0.15);
    }

    .mode-icon {
      font-size: 1.75rem;
      color: var(--text-secondary);
      transition: color 0.2s;
    }

    .mode-option input:checked + label .mode-icon {
      color: var(--accent);
    }

    .mode-label-text {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .mode-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .name-fields {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .field-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 0.35rem;
    }

    .field-group input {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border-strong);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field-group input::placeholder {
      color: var(--text-muted);
    }

    .field-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.12);
    }

    .person2-field {
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.3s ease, margin 0.3s ease;
      max-height: 100px;
      opacity: 1;
    }

    .person2-field.hidden {
      max-height: 0;
      opacity: 0;
      margin: 0;
      pointer-events: none;
    }

    .accounts-preview {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.85rem 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .accounts-preview strong {
      color: var(--text-primary);
      font-weight: 500;
    }

    .preview-title {
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.4rem;
    }

    .preview-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .preview-list li {
      padding: 0.2rem 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .preview-list li i {
      color: var(--accent);
      font-size: 0.75rem;
    }

    .submit-btn {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent-strong), var(--accent));
      color: #07090f;
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: -0.01em;
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(94, 234, 212, 0.3);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    @media (max-width: 480px) {
      body { padding: 1rem; }
      .setup-card { padding: 1.5rem; }
      .mode-options { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="setup-container">
    <div class="brand-row">
      <div class="brand-icon">₹</div>
      <h1 class="brand-title">Finance OS</h1>
      <div class="brand-sub">Welcome — let's set up your accounts</div>
    </div>

    <div class="setup-card">
      <form method="post" action="/setup" id="setupForm">
        <div class="step-label">How do you manage finances?</div>
        <div class="mode-options">
          <div class="mode-option">
            <input type="radio" name="mode" id="modeSingle" value="single">
            <label for="modeSingle">
              <i class="bi bi-person mode-icon"></i>
              <span class="mode-label-text">Solo</span>
              <span class="mode-desc">One person, two accounts</span>
            </label>
          </div>
          <div class="mode-option">
            <input type="radio" name="mode" id="modeCouple" value="couple" checked>
            <label for="modeCouple">
              <i class="bi bi-people mode-icon"></i>
              <span class="mode-label-text">Couple</span>
              <span class="mode-desc">Two people, joint account</span>
            </label>
          </div>
        </div>

        <div class="name-fields">
          <div class="field-group">
            <label for="person1_name">Your name</label>
            <input type="text" id="person1_name" name="person1_name"
                   placeholder="e.g. Alex" required maxlength="100" autocomplete="given-name">
          </div>
          <div class="field-group person2-field" id="person2Field">
            <label for="person2_name">Partner's name</label>
            <input type="text" id="person2_name" name="person2_name"
                   placeholder="e.g. Sam" maxlength="100">
          </div>
        </div>

        <div class="accounts-preview" id="accountsPreview">
          <div class="preview-title">Accounts that will be created</div>
          <ul class="preview-list" id="previewList">
            <li><i class="bi bi-check-circle-fill"></i> <strong>Person 1</strong> Salary</li>
            <li><i class="bi bi-check-circle-fill"></i> <strong>Person 2</strong> Salary</li>
            <li><i class="bi bi-check-circle-fill"></i> <strong>Joint</strong> Account (shared)</li>
          </ul>
        </div>

        <button type="submit" class="submit-btn">
          <i class="bi bi-rocket-takeoff me-1"></i> Get Started
        </button>
      </form>
    </div>
  </div>

  <script>
  (function () {
    var modeSingle = document.getElementById('modeSingle');
    var modeCouple = document.getElementById('modeCouple');
    var person2Field = document.getElementById('person2Field');
    var person1Input = document.getElementById('person1_name');
    var person2Input = document.getElementById('person2_name');
    var previewList = document.getElementById('previewList');

    function updateUI() {
      var isSingle = modeSingle.checked;
      var p1 = person1Input.value.trim() || 'Your';
      var p2 = person2Input.value.trim() || 'Partner';

      if (isSingle) {
        person2Field.classList.add('hidden');
        previewList.innerHTML =
          '<li><i class="bi bi-check-circle-fill"></i> <strong>' + p1 + '</strong> Salary (main account)</li>' +
          '<li><i class="bi bi-check-circle-fill"></i> <strong>' + p1 + '</strong> Expenses (daily spends)</li>';
      } else {
        person2Field.classList.remove('hidden');
        previewList.innerHTML =
          '<li><i class="bi bi-check-circle-fill"></i> <strong>' + p1 + '</strong> Salary</li>' +
          '<li><i class="bi bi-check-circle-fill"></i> <strong>' + p2 + '</strong> Salary</li>' +
          '<li><i class="bi bi-check-circle-fill"></i> <strong>Joint</strong> Account (shared)</li>';
      }
    }

    modeSingle.addEventListener('change', updateUI);
    modeCouple.addEventListener('change', updateUI);
    person1Input.addEventListener('input', updateUI);
    person2Input.addEventListener('input', updateUI);
    updateUI();
  })();
  </script>
</body>
</html>
