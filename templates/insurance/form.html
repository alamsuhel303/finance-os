{% extends "layout.html" %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">{{ 'Edit' if policy else 'Add' }} Policy</h1>
    <p class="page-subtitle">Track cover, premium, and renewal date</p>
  </div>
  <a href="{{ url_for('insurance.index') }}" class="btn btn-ghost">
    <i class="bi bi-arrow-left me-1"></i> Back
  </a>
</div>

<div class="glass-card form-card">
  <form method="post" novalidate>
    <div class="row g-3">
      <div class="col-md-8">
        <label class="form-label" for="name">Policy Name</label>
        <input type="text" class="form-control" id="name" name="name"
               value="{{ form_data.get('name', '') }}"
               placeholder="e.g. Family Floater — HDFC Ergo" required maxlength="120">
      </div>
      <div class="col-md-4">
        <label class="form-label" for="policy_type">Type</label>
        <select class="form-select" id="policy_type" name="policy_type">
          {% for t in policy_types %}
            <option value="{{ t }}" {% if form_data.get('policy_type') == t %}selected{% endif %}>
              {{ policy_labels.get(t, t) }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label" for="insurer">Insurer</label>
        <input type="text" class="form-control" id="insurer" name="insurer"
               value="{{ form_data.get('insurer', '') }}" placeholder="Company name">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="policy_number">Policy Number</label>
        <input type="text" class="form-control" id="policy_number" name="policy_number"
               value="{{ form_data.get('policy_number', '') }}">
      </div>

      <div class="col-md-4">
        <label class="form-label" for="cover_amount">Cover ({{ currency }})</label>
        <input type="number" step="0.01" min="0" class="form-control" id="cover_amount" name="cover_amount"
               value="{{ form_data.get('cover_amount', '') }}" placeholder="0.00"
               data-amount-words="coverWords">
        <div class="form-text amount-words" id="coverWords"></div>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="premium_amount">Premium ({{ currency }})</label>
        <input type="number" step="0.01" min="0" class="form-control" id="premium_amount" name="premium_amount"
               value="{{ form_data.get('premium_amount', '') }}" placeholder="0.00"
               data-amount-words="premiumWords">
        <div class="form-text amount-words" id="premiumWords"></div>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="premium_frequency">Premium Frequency</label>
        <select class="form-select" id="premium_frequency" name="premium_frequency">
          {% for f in premium_frequencies %}
            <option value="{{ f }}" {% if form_data.get('premium_frequency', 'yearly') == f %}selected{% endif %}>
              {{ frequency_labels.get(f, f) }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label" for="next_renewal_date">Next Renewal</label>
        <input type="date" class="form-control" id="next_renewal_date" name="next_renewal_date"
               value="{{ form_data.get('next_renewal_date', '') }}">
      </div>
      <div class="col-md-4">
        <label class="form-label" for="owner">Owner</label>
        <select class="form-select" id="owner" name="owner">
          {% for o in owners %}
            <option value="{{ o }}" {% if form_data.get('owner', 'joint') == o %}selected{% endif %}>{{ o | capitalize }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="sort_order">Sort Order</label>
        <input type="number" class="form-control" id="sort_order" name="sort_order"
               value="{{ form_data.get('sort_order', '0') }}">
      </div>

      <div class="col-12">
        <label class="form-label" for="notes">Notes</label>
        <textarea class="form-control" id="notes" name="notes" rows="2">{{ form_data.get('notes', '') }}</textarea>
      </div>

      <div class="col-12">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="is_active" name="is_active" value="1"
                 {% if form_data.get('is_active', '1') in ['1', 'true', 'on'] %}checked{% endif %}>
          <label class="form-check-label" for="is_active">Active</label>
        </div>
      </div>
    </div>

    <div class="d-flex gap-2 mt-4">
      <button type="submit" class="btn btn-accent">
        <i class="bi bi-check-lg me-1"></i> Save
      </button>
      <a href="{{ url_for('insurance.index') }}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/amount-words.js') }}?v=2"></script>
{% endblock %}
