{% extends "layout.html" %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">{{ 'Edit' if liability else 'Add' }} Liability</h1>
    <p class="page-subtitle">Loans and debts that reduce net worth</p>
  </div>
  <a href="{{ url_for('networth.index') }}" class="btn btn-ghost">
    <i class="bi bi-arrow-left me-1"></i> Back
  </a>
</div>

<div class="glass-card form-card">
  <form method="post" novalidate>
    <div class="row g-3">
      <div class="col-md-8">
        <label class="form-label" for="name">Name</label>
        <input type="text" class="form-control" id="name" name="name"
               value="{{ form_data.get('name', '') }}"
               placeholder="e.g. Home Loan — HDFC" required maxlength="120">
      </div>
      <div class="col-md-4">
        <label class="form-label" for="liability_type">Type</label>
        <select class="form-select" id="liability_type" name="liability_type">
          {% for t in liability_types %}
            <option value="{{ t }}" {% if form_data.get('liability_type') == t %}selected{% endif %}>
              {{ t | replace('_', ' ') | title }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label" for="outstanding_amount">Outstanding ({{ currency }})</label>
        <input type="number" step="0.01" min="0" class="form-control" id="outstanding_amount" name="outstanding_amount"
               value="{{ form_data.get('outstanding_amount', '') }}" placeholder="0.00" required
               data-amount-words="outstandingWords">
        <div class="form-text amount-words" id="outstandingWords"></div>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="interest_rate">Interest Rate %</label>
        <input type="number" step="0.01" min="0" class="form-control" id="interest_rate" name="interest_rate"
               value="{{ form_data.get('interest_rate', '') }}" placeholder="8.50">
      </div>
      <div class="col-md-4">
        <label class="form-label" for="owner">Owner</label>
        <select class="form-select" id="owner" name="owner">
          {% for o in owners %}
            <option value="{{ o }}" {% if form_data.get('owner', 'joint') == o %}selected{% endif %}>{{ o | capitalize }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-12">
        <label class="form-label" for="notes">Notes</label>
        <textarea class="form-control" id="notes" name="notes" rows="2">{{ form_data.get('notes', '') }}</textarea>
      </div>

      <div class="col-12">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="is_active" name="is_active" value="1"
                 {% if form_data.get('is_active', '1') in ['1', 'true', 'on'] %}checked{% endif %}>
          <label class="form-check-label" for="is_active">Active</label>
        </div>
      </div>
    </div>

    <div class="d-flex gap-2 mt-4">
      <button type="submit" class="btn btn-accent">
        <i class="bi bi-check-lg me-1"></i> Save
      </button>
      <a href="{{ url_for('networth.index') }}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/amount-words.js') }}?v=2"></script>
{% endblock %}
