{% extends "layout.html" %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">{{ 'Edit' if template else 'Add' }} Recurring Income</h1>
    <p class="page-subtitle">Monthly salary / credit template — post from Dashboard each month</p>
  </div>
  <a href="{{ url_for('settings.index') }}" class="btn btn-ghost">
    <i class="bi bi-arrow-left me-1"></i> Back
  </a>
</div>

<div class="glass-card form-card">
  <form method="post" novalidate>
    <div class="row g-3">
      <div class="col-md-8">
        <label class="form-label" for="name">Name</label>
        <input type="text" class="form-control" id="name" name="name"
               value="{{ form_data.get('name', '') }}"
               placeholder="e.g. {{ person1_name }} Salary" required maxlength="120">
      </div>
      <div class="col-md-4">
        <label class="form-label" for="day_of_month">Credit day</label>
        <input type="number" class="form-control" id="day_of_month" name="day_of_month"
               min="1" max="28" value="{{ form_data.get('day_of_month', '1') }}" required>
        <div class="form-text">1–28</div>
      </div>

      <div class="col-md-4">
        <label class="form-label" for="amount">Amount ({{ currency }})</label>
        <input type="number" step="0.01" min="0.01" class="form-control" id="amount" name="amount"
               value="{{ form_data.get('amount', '') }}" placeholder="0.00" required
               data-amount-words="amountWords">
        <div class="form-text amount-words" id="amountWords"></div>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="account_id">Credit Account</label>
        <select class="form-select" id="account_id" name="account_id" required>
          <option value="">Select account</option>
          {% for acc in accounts %}
            <option value="{{ acc.id }}" {% if form_data.get('account_id')|string == acc.id|string %}selected{% endif %}>
              {{ acc.name }}
            </option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="owner">Owner</label>
        <select class="form-select" id="owner" name="owner">
          {% for o in owners %}
            <option value="{{ o }}" {% if form_data.get('owner', 'self') == o %}selected{% endif %}>{{ o | capitalize }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-12">
        <label class="form-label" for="notes">Notes</label>
        <textarea class="form-control" id="notes" name="notes" rows="2">{{ form_data.get('notes', '') }}</textarea>
      </div>

      <div class="col-12">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="is_active" name="is_active" value="1"
                 {% if form_data.get('is_active', '1') in ['1', 'true', 'on'] %}checked{% endif %}>
          <label class="form-check-label" for="is_active">Active</label>
        </div>
      </div>
    </div>

    <div class="d-flex gap-2 mt-4">
      <button type="submit" class="btn btn-accent">
        <i class="bi bi-check-lg me-1"></i> Save
      </button>
      <a href="{{ url_for('settings.index') }}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/amount-words.js') }}?v=2"></script>
{% endblock %}
